<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Don't Break the Chain</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#263047;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.app{max-width:480px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 18px 30px}h1{font-size:25px;letter-spacing:-.8px;margin:8px 0 5px}p{color:#798399;margin:0 0 24px;font-size:14px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.nav{display:flex;gap:10px;align-items:center}button{border:0;border-radius:12px;padding:9px 13px;background:#e7eaf5;color:#38445e;font-weight:700;font-size:17px;cursor:pointer}#month{min-width:126px;text-align:center;font-weight:650;font-size:14px}.calendar{background:white;padding:14px 10px 18px;border-radius:22px;box-shadow:0 9px 35px #202a4310}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:11px;color:#8993a8;padding:7px 0 12px}.day{aspect-ratio:1;border:0;border-radius:11px;background:#f2f4fa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600;color:#59667c;padding:2px;touch-action:manipulation}.day .x{font-size:20px;line-height:1;font-weight:850}.day.done{background:#d7f3e3;color:#16764c}.day.today{outline:2px solid #8b91e9;outline-offset:-2px}.empty{background:transparent}.stats{display:flex;gap:12px;margin-top:17px}.stat{flex:1;background:white;padding:15px;border-radius:16px;text-align:center}.stat strong{display:block;font-size:24px;color:#5555b9}.stat small{color:#8790a1}footer{font-size:12px;color:#9098a7;text-align:center;margin-top:22px}
.app-support-row{text-align:center;margin:18px 0 8px}.app-support-link{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid #ddd3e1;border-radius:999px;background:#fffaf2;color:#80504b;text-decoration:none;font:12px/1.4 system-ui,-apple-system,sans-serif;max-width:100%;white-space:normal}.app-support-link:hover{background:#f8eee2;border-color:#b98780;color:#733c36}.app-support-link:focus-visible{outline:3px solid #a590d9;outline-offset:3px}@media print{.app-support-row{display:none!important}}
</style></head>
<body><main class="app"><h1>Don't Break the Chain ✨</h1><p>One day at a time. Tap a date to mark your X.</p><div class="bar"><strong>Your calendar</strong><div class="nav"><button id="prev" aria-label="Previous month">‹</button><span id="month"></span><button id="next" aria-label="Next month">›</button></div></div><section class="calendar"><div class="grid" id="week"></div><div class="grid" id="days"></div></section><div class="stats"><div class="stat"><strong id="streak">0</strong><small>Current streak</small></div><div class="stat"><strong id="total">0</strong><small>Days completed</small></div></div><footer>Saved privately on this device. Add to your Home Screen in Safari.<div class="app-support-row"><a class="app-support-link" href="https://infinitilogicsolutions.github.io/support/" aria-label="Support Santosh’s weekend projects"><span aria-hidden="true">☕</span> Enjoy X Calendar? Buy me a coffee</a></div></footer></main>
<script>
const KEY='dontBreakTheChain_days';let marked={};try{marked=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}let view=new Date();view.setDate(1);const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());function render(){const y=view.getFullYear(),m=view.getMonth(),now=new Date(),today=key(now);$('month').textContent=view.toLocaleDateString(undefined,{month:'short',year:'numeric'});$('week').innerHTML=['S','M','T','W','T','F','S'].map(d=>'<div class="weekday">'+d+'</div>').join('');const days=$('days');days.replaceChildren();for(let i=0;i<new Date(y,m,1).getDay();i++){let e=document.createElement('div');e.className='day empty';days.append(e)}for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let k=key(new Date(y,m,n)),b=document.createElement('button');b.type='button';b.className='day'+(marked[k]?' done':'')+(k===today?' today':'');b.setAttribute('aria-label',k+(marked[k]?' completed':''));b.setAttribute('aria-pressed',!!marked[k]);b.innerHTML='<span>'+n+'</span><span class="x">'+(marked[k]?'×':'')+'</span>';b.onclick=()=>{if(marked[k])delete marked[k];else marked[k]=true;try{localStorage.setItem(KEY,JSON.stringify(marked))}catch(e){alert('Unable to save data on this device')}render()};days.append(b)}$('total').textContent=Object.keys(marked).filter(k=>marked[k]).length;let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),streak=0;if(!marked[key(d)])d.setDate(d.getDate()-1);while(marked[key(d)]){streak++;d.setDate(d.getDate()-1)}$('streak').textContent=streak}function move(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);render();
</script></body></html>

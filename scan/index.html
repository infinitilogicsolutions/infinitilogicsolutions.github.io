<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><title>Scan</title><style>:root{color-scheme:dark;--accent:#ffd60a}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#000;color:#fff;overflow:hidden}button{font:inherit;color:inherit;background:none;border:0}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 18px 10px;z-index:3}.top strong{font-size:17px}.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#222;font-size:20px}.stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;background:#080808}.stage video,.stage img,.stage canvas{width:100%;height:100%;object-fit:cover}.stage canvas{object-fit:contain}.guide{position:absolute;inset:7% 6%;border:2px solid var(--accent);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.2);pointer-events:none}.hint{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:18px;background:rgba(0,0,0,.58);font-size:13px;white-space:nowrap}.bottom{padding:12px 18px max(14px,env(safe-area-inset-bottom));background:#0b0b0b}.capturebar{display:grid;grid-template-columns:1fr 86px 1fr;align-items:center}.capture{width:74px;height:74px;border:4px solid #fff;border-radius:50%;padding:5px;justify-self:center}.capture:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#fff}.side{font-size:14px;color:#ddd}.right{text-align:right}.review{display:none;height:100dvh;grid-template-rows:auto 1fr auto;background:#111}.review.on{display:grid}.camera.off{display:none}.tools{display:flex;justify-content:space-around;padding:10px 8px max(12px,env(safe-area-inset-bottom));background:#111}.tool{display:grid;gap:4px;place-items:center;font-size:12px}.tool b{font-size:21px}.done{color:var(--accent);font-weight:700}.filters{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.pill{padding:8px 12px;border-radius:18px;background:rgba(30,30,30,.88);font-size:12px}.pill.active{background:var(--accent);color:#000}.hidden{display:none!important}</style></head><body>
<section id="camera" class="app camera"><header class="top"><button id="close" class="icon">×</button><strong>Scan Document</strong><button id="flash" class="icon">⚡︎</button></header><main class="stage"><video id="video" autoplay playsinline muted></video><div class="guide"></div><div class="hint">Position the document inside the frame</div></main><footer class="bottom"><div class="capturebar"><label class="side">Photos<input id="file" class="hidden" type="file" accept="image/*"></label><button id="capture" class="capture" aria-label="Capture"></button><span class="side right">Auto</span></div></footer></section>
<section id="review" class="review"><header class="top"><button id="retake">Retake</button><strong>Preview</strong><button id="done" class="done">Done</button></header><main class="stage"><canvas id="canvas"></canvas><div class="filters"><button class="pill active" data-filter="auto">Auto</button><button class="pill" data-filter="color">Color</button><button class="pill" data-filter="gray">Grayscale</button><button class="pill" data-filter="bw">B&amp;W</button></div></main><footer class="tools"><button id="rotate" class="tool"><b>↻</b><span>Rotate</span></button><button id="share" class="tool"><b>□↑</b><span>Save / Share</span></button><button id="again" class="tool"><b>＋</b><span>Scan Again</span></button></footer></section>
<script>const $=s=>document.querySelector(s),video=$('#video'),canvas=$('#canvas'),ctx=canvas.getContext('2d');let stream=null,source=null,rotation=0,filter='auto';async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:2560}},audio:false});video.srcObject=stream}catch(e){$('.hint').textContent='Camera unavailable — choose Photos'}}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function render(){if(!source)return;const sw=source.videoWidth||source.naturalWidth,sh=source.videoHeight||source.naturalHeight,turn=rotation%180!==0;canvas.width=turn?sh:sw;canvas.height=turn?sw:sh;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rotation*Math.PI/180);ctx.filter=filter==='gray'?'grayscale(1) contrast(1.08)':filter==='bw'?'grayscale(1) contrast(1.7) brightness(1.08)':filter==='auto'?'contrast(1.12) brightness(1.04) saturate(.96)':'none';ctx.drawImage(source,-sw/2,-sh/2,sw,sh);ctx.restore();ctx.filter='none'}function review(src){source=src;rotation=0;stop();$('#camera').classList.add('off');$('#review').classList.add('on');render()}$('#capture').onclick=()=>{if(!video.videoWidth)return;const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);const img=new Image();img.onload=()=>review(img);img.src=c.toDataURL('image/jpeg',.94)};$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>review(img);img.src=URL.createObjectURL(f)};function back(){ $('#review').classList.remove('on');$('#camera').classList.remove('off');source=null;start()}$('#retake').onclick=$('#again').onclick=back;$('#rotate').onclick=()=>{rotation=(rotation+90)%360;render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});async function save(){const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.94)),file=new File([blob],'scan-'+Date.now()+'.jpg',{type:'image/jpeg'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Scanned Document'});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}}catch(e){}}$('#share').onclick=$('#done').onclick=save;$('#flash').onclick=async()=>{const t=stream?.getVideoTracks()[0],caps=t?.getCapabilities?.();if(!caps?.torch)return;const on=$('#flash').dataset.on!=='1';try{await t.applyConstraints({advanced:[{torch:on}]});$('#flash').dataset.on=on?'1':'0';$('#flash').style.color=on?'#ffd60a':''}catch(e){}};$('#close').onclick=stop;start();</script></body></html>

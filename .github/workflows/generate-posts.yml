name: Generate Posts JSON

on:
  push:
    branches: [ main ]
    paths:
      - 'posts/**/*.md'
      - 'scripts/generate-json.js'
      - 'post.html'
      - 'assets/js/article-renderer.js'
      - 'assets/js/listing-renderer.js'
      - 'assets/css/custom.css'
      - 'assets/js/notifications.js'
      - 'scripts/generate-thumbnails.js'
      - 'scripts/build-css.js'
      - 'scripts/styles-source.css'
      - 'assets/img/og/**'
      - 'package.json'
      - 'index.html'
      - 'projects.html'
      - 'blog.html'
  schedule:
    # Runs nightly at 02:17 UTC; non-zero minute avoids GitHub's peak top-of-hour load
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  generate-json:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      
      - name: Generate posts content
        run: npm run generate
      
      - name: Check for changes
        id: check_changes
        run: |
          if git status --porcelain --untracked-files=all -- data/posts.json data/posts-index.json data/thumbnails.json posts index.html projects.html blog.html assets/css/styles.css assets/css/site.css assets/img/thumbs | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure deploy key for push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${GITHUB_REPOSITORY}.git

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A data/posts.json data/posts-index.json data/thumbnails.json posts index.html projects.html blog.html assets/css/styles.css assets/css/site.css assets/img/thumbs
          git commit -m "🤖 Auto-generate posts content"
          git push origin HEAD:main
